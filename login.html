<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link
  rel="stylesheet"
  href="./node_modules/bootstrap/dist/css/bootstrap.min.css"
/>
    <title>Login | Movie Website</title>
    <!-- CSS -->
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <header id="header" class="">
        <div class="logo">
            <a href="index.html">Streom<span>Vibe</span></a>
        </div>
        <nav>
        <button type="submit" class="btn btn-danger"><a class="text-white text-decoration-none" href="/index.html">back to home</a></button>
        </nav>
    </header>
    <!-- Login Section -->
    <main class="login-container">
        <div class="login-box">
            <!-- Title -->
            <div class="login-title">
                <h1>Welcome Back!</h1>
                <p>
                    Sign in to continue watching
                    your favorite movies.
                </p>
            </div>
            <!-- Login Form -->
            <form id="loginForm">
                <!-- Email -->
                <div class="input-group1">
                   
                    <label for="email">Email Address</label>
                     <span id="masseageerroremail"></span>
                    <input
                        type="email"
                        class="inputEmaile"
                        placeholder="Enter your email"
                        required>
                </div>
                <!-- Password -->
                <div class="input-group1">
                    <label for="password">Password</label>
                    <span id="masseageerrorpas"></span>
                    <input
                        type="password"
                        id="inpotPassword"
                        placeholder="Enter your password"
                        required>
                </div>
                <!-- Remember & Forgot Password -->
                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox" id="remember">
                        Remember Me
                    </label>
                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>
                </div>
                <!-- Login Button -->
                <button type="submit" class="login-btn">
                    LOGIN
                </button>
                <!-- Message -->
                <p id="message"></p>
                <!-- Sign Up -->
                <div class="signup-link">
                    <p>
                        Don't have an account?
                        <a href="/sigun.html">
                            Sign Up
                        </a>
                    </p>
                </div>
            </form>
        </div>
    </main>


    <!-- JavaScript -->
    <script src="./js/main.js"></script>
</body>
</html>
